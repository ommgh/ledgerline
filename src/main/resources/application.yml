spring:
  application:
    name: ledgerline
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
    username: ${DB_USER:ledgerline}
    password: ${DB_PASSWORD:ledgerline}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ledgerline:
  ledger:
    # attempts after the first when two transactions update the same account
    max-retries: 10
  idempotency:
    # how long a key is remembered; retries after this are treated as new requests
    retention: 24h
    purge-cron: "0 15 * * * *"
  outbox:
    topic: ledger.events
    partitions: 3
    poll-interval-ms: 500
    batch-size: 100
  webhooks:
    razorpay-secret: ${RAZORPAY_WEBHOOK_SECRET:dev-only-secret}
